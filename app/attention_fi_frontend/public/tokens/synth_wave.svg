<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0c0020"/><stop offset="50%" stop-color="#581c87"/><stop offset="100%" stop-color="#f43f5e"/></linearGradient>
    <linearGradient id="grid" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#ec4899" stop-opacity="0.6"/><stop offset="100%" stop-color="#ec4899" stop-opacity="0"/></linearGradient>
  </defs>
  <rect width="96" height="96" fill="url(#sky)"/>
  <!-- sun -->
  <circle cx="48" cy="52" r="14" fill="#fbbf24" opacity="0.8"/>
  <rect x="0" y="52" width="96" height="2" fill="#0c0020" opacity="0.5"/>
  <rect x="0" y="56" width="96" height="2" fill="#0c0020" opacity="0.4"/>
  <!-- perspective grid -->
  <g stroke="url(#grid)" stroke-width="0.8" fill="none">
    <line x1="0" y1="60" x2="96" y2="60"/>
    <line x1="0" y1="68" x2="96" y2="68"/>
    <line x1="0" y1="78" x2="96" y2="78"/>
    <line x1="0" y1="90" x2="96" y2="90"/>
    <line x1="48" y1="58" x2="48" y2="96"/>
    <line x1="48" y1="58" x2="0" y2="96"/>
    <line x1="48" y1="58" x2="96" y2="96"/>
    <line x1="48" y1="58" x2="16" y2="96"/>
    <line x1="48" y1="58" x2="80" y2="96"/>
  </g>
  <!-- stars -->
  <circle cx="20" cy="14" r="1" fill="#fff" opacity="0.6"/>
  <circle cx="72" cy="10" r="1.2" fill="#fff" opacity="0.5"/>
  <circle cx="82" cy="28" r="0.8" fill="#fff" opacity="0.4"/>
  <circle cx="14" cy="36" r="0.8" fill="#fff" opacity="0.3"/>
</svg>
